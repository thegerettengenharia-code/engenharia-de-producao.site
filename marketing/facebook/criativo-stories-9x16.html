<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0B0E11;
    color: #F8F9FA;
    position: relative;
  }
  .glow {
    position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,85,255,0.4) 0%, rgba(0,229,255,0.1) 45%, transparent 70%);
    top: -320px; left: -200px;
  }
  .glow2 {
    position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184,115,51,0.16) 0%, transparent 65%);
    bottom: -300px; right: -240px;
  }
  /* Zona segura Stories: nada crítico acima de 260px nem abaixo de 1660px */
  .frame { position: relative; height: 100%; padding: 300px 90px 280px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand-mark {
    width: 64px; height: 64px; border-radius: 17px;
    background: linear-gradient(135deg, #0055FF, #00E5FF);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter Tight'; font-weight: 800; font-size: 33px; color: #fff;
  }
  .brand-name { font-family: 'Inter Tight'; font-weight: 800; font-size: 38px; letter-spacing: 0.5px; }
  .brand-sub { font-size: 21px; color: #8892A0; letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
  .badge {
    margin-left: auto; background: rgba(0,229,255,0.12); border: 2px solid rgba(0,229,255,0.5);
    color: #00E5FF; font-weight: 700; font-size: 23px; letter-spacing: 2px;
    padding: 15px 30px; border-radius: 999px; text-transform: uppercase;
  }
  h1 {
    font-family: 'Inter Tight'; font-weight: 800; font-size: 104px; line-height: 1.05;
    letter-spacing: -2.5px; margin-top: 90px;
  }
  h1 span { color: #4D8DFF; }
  .sub { font-size: 36px; color: #B7BFCC; line-height: 1.45; margin-top: 38px; font-weight: 400; }
  .stats { display: flex; flex-direction: column; gap: 24px; margin-top: 70px; }
  .stat {
    display: flex; align-items: baseline; gap: 26px;
    background: #14181E; border: 1px solid rgba(136,146,160,0.18);
    border-radius: 26px; padding: 34px 44px;
  }
  .stat b { font-family: 'Inter Tight'; font-weight: 800; font-size: 72px; min-width: 270px; }
  .stat i { font-style: normal; font-size: 30px; color: #8892A0; font-weight: 600; }
  .cta-bar {
    margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 22px;
    text-align: center;
  }
  .cta-btn {
    background: linear-gradient(90deg, #0055FF, #0080FF); color: #fff;
    font-weight: 700; font-size: 40px; padding: 34px 96px; border-radius: 999px;
  }
  .cta-url { font-family: 'Inter Tight'; font-weight: 800; font-size: 44px; color: #fff; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="frame">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">Gerett</div>
        <div class="brand-sub">Eng. de Produção</div>
      </div>
      <div class="badge">Grátis</div>
    </div>

    <h1>Estude Engenharia de Produção <span>de verdade.</span></h1>
    <p class="sub">Flashcards, caderno em PDF e biblioteca completa — direto no navegador.</p>

    <div class="stats">
      <div class="stat"><b>31</b><i>áreas de conhecimento</i></div>
      <div class="stat"><b>593</b><i>temas organizados</i></div>
      <div class="stat"><b>+89</b><i>materiais para download</i></div>
    </div>

    <div class="cta-bar">
      <div class="cta-btn">Estudar agora</div>
      <div class="cta-url">thegerett.com.br</div>
    </div>
  </div>
</body>
</html>
