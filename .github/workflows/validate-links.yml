name: Validar links — Biblioteca Digital

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar validação de links
        id: validate
        run: node scripts/validate-links.js

      - name: Commit do relatório
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/link-check.md
          git diff --cached --quiet || git commit -m "chore: atualiza relatório de verificação de links [skip ci]"
          git push
        continue-on-error: true

      - name: Sinalizar falha (notificação de commit)
        if: ${{ steps.validate.outcome == 'failure' }}
        run: echo "::warning::Foram encontrados problemas no acervo — verifique reports/link-check.md"
